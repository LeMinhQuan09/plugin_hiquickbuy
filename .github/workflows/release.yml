name: Build & Publish HI Quick-Buy Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint all PHP files
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Build clean production ZIP
        run: |
          mkdir -p /tmp/hi-quick-buy
          rsync -av --exclude='.git*' \
            --exclude='.github' \
            --exclude='tinh.csv' \
            --exclude='xa.csv' \
            --exclude='playground-blueprint.json' \
            --exclude='quick-buy-plugin-blueprint.md' \
            --exclude='node_modules' \
            ./ /tmp/hi-quick-buy/
          cd /tmp
          zip -r "${{ github.workspace }}/hi-quick-buy.zip" hi-quick-buy

      - name: Create GitHub Release with ZIP asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: hi-quick-buy.zip

